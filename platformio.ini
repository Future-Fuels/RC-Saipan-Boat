[env]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 460800
board_build.partitions = huge_app.csv

[env:rx]
build_src_filter = +<rx.cpp>
lib_deps =
  madhephaestus/ESP32Servo@^3.2.1
  adafruit/Adafruit BNO055
  mikalhart/TinyGPSPlus

[env:tx]
build_src_filter = +<tx.cpp>

[env:imu-calibrate]
build_src_filter = +<imu_calibrate.cpp>
lib_deps =
  adafruit/Adafruit BNO055
