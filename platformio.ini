; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200

[env:rx]
board_build.partitions = huge_app.csv
build_src_filter = +<rx.cpp>
lib_deps = 
	madhephaestus/ESP32Servo@^3.2.1
	adafruit/Adafruit BNO055
	mikalhart/TinyGPSPlus

[env:servo-test]
build_src_filter = +<servo_test.cpp>
lib_deps = 
  madhephaestus/ESP32Servo@^3.2.1

[env:sensor-test]
build_src_filter = +<sensor_test.cpp>
lib_deps =
	adafruit/Adafruit BNO055
	mikalhart/TinyGPSPlus

[env:tx]
board_build.partitions = huge_app.csv
build_src_filter = +<tx.cpp>

[env:rx-esp-now]
board_build.partitions = huge_app.csv
build_src_filter = +<rx_esp_now.cpp>
lib_deps = ${env:rx.lib_deps}

[env:tx-esp-now]
board_build.partitions = huge_app.csv
build_src_filter = +<tx_esp_now.cpp>
board_build.embed_txtfiles =
  monitor_esp_now/index.html
  monitor_esp_now/app.js
