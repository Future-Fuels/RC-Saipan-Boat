; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200

[env:rx]
build_src_filter = +<*> -<tx.cpp> -<test.cpp>
lib_deps = 
	madhephaestus/ESP32Servo@^3.2.1
	wollewald/MPU9250_WE@^1.2.17

[env:servo-test]
build_src_filter = +<servo_test.cpp>
lib_deps = 
  madhephaestus/ESP32Servo@^3.2.1

[env:sensor-test]
build_src_filter = +<sensor_test.cpp>
lib_deps =
	adafruit/Adafruit BNO055
	mikalhart/TinyGPSPlus

[env:tx]
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<rx.cpp> -<test.cpp>
