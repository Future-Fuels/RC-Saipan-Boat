<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>rcboat monitor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="monitor.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header class="controls-bar">
      <button type="button" id="connectBtn">connect</button>
      <span id="status">disconnected</span>
      <span id="pktInfo"></span>
      <button type="button" id="calibrateBtn">calibrate imu</button>
      <span id="calibrateStatus"></span>

      <hr />

      <button type="button" id="recordBtn">record</button>
      <label for="sampleRate">samples per sec</label>
      <input type="number" id="sampleRate" value="10" min="1" max="100" />
      <label for="captureDuration">capture sec</label>
      <input type="number" id="captureDuration" value="10" min="1" max="300" />
      <button type="button" id="captureBtn">capture</button>
      <button type="button" id="exportBtn">csv</button>
      <span id="recordStatus"></span>
    </header>

    <pre id="controls"></pre>

    <div class="visual-row">
      <table class="joystick-grid">
        <tr>
          <td><canvas id="j1" width="160" height="160"></canvas></td>
          <td><canvas id="j2" width="160" height="160"></canvas></td>
        </tr>
      </table>

      <div id="boatContainer"></div>
    </div>

    <section class="graph-section">
      <h2>accelerometer</h2>
      <canvas id="accGraph" width="480" height="120"></canvas>
      <pre id="resG"></pre>
      <pre id="attitude"></pre>
      <canvas id="tiltGraph" width="480" height="100"></canvas>
      <pre id="tiltPeak"></pre>
    </section>

    <section class="graph-section">
      <h2>gyroscope</h2>
      <canvas id="gyroGraph" width="480" height="120"></canvas>
      <pre id="gyroVals"></pre>
    </section>

    <script type="module" src="monitor.js"></script>
  </body>
</html>
